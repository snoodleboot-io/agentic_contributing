name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint (strict validation of this repo's own contract)
        run: make lint

      - name: Validate the template
        run: make check-template

      - name: Validate the worked example (strict)
        run: make check-examples

      - name: Test
        run: make test
